name: Build and Release CPRay Gaming

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Download Latest Sing-box Core Binary
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/SagerNet/sing-box/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match 'windows-amd64\.zip$' } | Select-Object -First 1
          Write-Host "Downloading $($asset.name)..."
          curl.exe -L -o "singbox.zip" $asset.browser_download_url
          Expand-Archive -Path "singbox.zip" -DestinationPath "singbox_temp" -Force
          $coreExe = Get-ChildItem -Path "singbox_temp" -Filter "sing-box.exe" -Recurse | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "assets" | Out-Null
          Copy-Item $coreExe.FullName -Destination "assets\sing-box.exe" -Force

      - name: Build Flutter Windows Application
        run: flutter build windows --release

      - name: Copy Sing-box Core to Release Directory
        shell: pwsh
        run: |
          Copy-Item "assets\sing-box.exe" -Destination "build\windows\x64\runner\Release\sing-box.exe" -Force

      - name: Compile Inno Setup Installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss

      - name: Create Release Zip Package
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\CPRay-Gaming-Windows-Portable.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "CPRay Gaming ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/installer/CPRay-Gaming-Setup.exe
            build/CPRay-Gaming-Windows-Portable.zip
