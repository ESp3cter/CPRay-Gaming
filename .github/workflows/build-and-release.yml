name: Build and Release CPRay Gaming

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Enable Windows Desktop Support & Set Administrator Privileges
        run: |
          flutter config --enable-windows-desktop
          flutter create --project-name=cpray_gaming --platforms=windows --org=com.cpray.gaming .
          (Get-Content "windows\runner\runner.exe.manifest") -replace 'level="asInvoker"', 'level="requireAdministrator"' | Set-Content "windows\runner\runner.exe.manifest"

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Download Latest Sing-box Core Binary
        shell: pwsh
        run: |
          $downloadUrl = ""
          try {
            $headers = @{ "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}" }
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/SagerNet/sing-box/releases/latest" -Headers $headers
            $asset = $release.assets | Where-Object { $_.name -match 'windows-amd64\.zip$' } | Select-Object -First 1
            $downloadUrl = $asset.browser_download_url
          } catch {
            Write-Host "API rate limit or error, falling back to direct URL..."
            $downloadUrl = "https://github.com/SagerNet/sing-box/releases/download/v1.11.4/sing-box-1.11.4-windows-amd64.zip"
          }
          Write-Host "Downloading from $downloadUrl..."
          curl.exe -L -o "singbox.zip" $downloadUrl
          Expand-Archive -Path "singbox.zip" -DestinationPath "singbox_temp" -Force
          $coreExe = Get-ChildItem -Path "singbox_temp" -Filter "sing-box.exe" -Recurse | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "assets" | Out-Null
          Copy-Item $coreExe.FullName -Destination "assets\sing-box.exe" -Force

      - name: Set up Visual Studio Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Flutter Windows Application
        run: flutter build windows --release

      - name: Copy Sing-box Core to Release Directory
        shell: pwsh
        run: |
          Copy-Item "assets\sing-box.exe" -Destination "build\windows\x64\runner\Release\sing-box.exe" -Force
          New-Item -ItemType Directory -Force -Path "build\installer" | Out-Null

      - name: Compile Inno Setup Installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss

      - name: Create Release Zip Package
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\CPRay-Gaming-Windows-Portable.zip" -Force

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: build/installer/CPRay-Gaming-Setup.exe

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: build/CPRay-Gaming-Windows-Portable.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare Android APK
        run: |
          mkdir -p build_output
          cp build/app/outputs/flutter-apk/app-release.apk build_output/CPRay-Gaming.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build_output/CPRay-Gaming.apk

  publish-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Setup
        uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: release-files

      - name: Download Windows Portable
        uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: release-files

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-files

      - name: Publish Unified GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "CPRay Gaming ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-files/CPRay-Gaming-Setup.exe
            release-files/CPRay-Gaming-Windows-Portable.zip
            release-files/CPRay-Gaming.apk
